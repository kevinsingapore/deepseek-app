version: '3.8'  # 使用docker-compose的版本

services:
  mysql:  # 服务名称
    image: mysql:5.7  # 使用MySQL 5.7的镜像
    container_name: mysql57  # 容器名称
    environment:  # 环境变量
      MYSQL_ROOT_PASSWORD: Wnml6OeywzKvE3Ac  # root用户的密码
      MYSQL_DATABASE: logs  # 创建的数据库名称
      MYSQL_USER: kevin  # 创建的用户
      MYSQL_PASSWORD: Wnml6OeywzKvE3Ac  # 用户的密码
      MYSQL_CHARSET: utf8mb4 # 设置字符集为utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci # 设置校对规则，通常与字符集一起设置
      TZ: Asia/Shanghai # 设置时区为上海时区
    ports:  # 端口映射
      - "3306:3306"  # 将容器的3306端口映射到主机的3306端口
    restart: always  # 容器总是重新启动
